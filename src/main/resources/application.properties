
server.port=9090
# databse confugarion file
spring.datasource.url=jdbc:mysql://localhost:3306/electronic_store?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
debug=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# user image path
user.profile.image.path=images/user/

#category image path
category.profile.image.path=images/category/

#maximum upload size for image
spring.servlet.multipart.max-file-size=100MB

 # Maximum size for the entire request
spring.servlet.multipart.max-request-size=150MB